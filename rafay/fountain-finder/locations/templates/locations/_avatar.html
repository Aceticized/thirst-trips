<span class="avatar{% if css_class %} {{ css_class }}{% endif %}" style="{{ box_style }}"{% if preview %} data-preview{% endif %}{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}><span class="avatar-stage" style="{{ stage_style }}">{% for layer in layers %}<img data-slot="{{ layer.slot }}"{% if layer.url %} src="{{ layer.url }}"{% else %} hidden{% endif %} alt="" draggable="false" decoding="async">{% endfor %}</span></span>
