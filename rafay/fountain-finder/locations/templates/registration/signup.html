<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fountain Finder — Sign up</title></head>
<body><main>
<h1>Create your account</h1>
<p>Choose a username and password to track your points.</p>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}">
<button type="submit">Create account</button>
</form>
<p><a href="{% url 'login' %}?next={{ next|urlencode }}">Already have an account? Log in</a></p>
</main></body></html>
