{% extends "locations/auth_base.html" %}
{% load static %}
{% block title %}Create Account · Fountain Finder{% endblock %}
{% block content %}
<h1>Create Account</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "locations/_form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="img-btn" type="submit" aria-label="Create Account"><img src="{% static 'locations/img/submit.png' %}" alt="" draggable="false"></button>
</form>
<p class="alt">Already have an account? <a href="{{ login_url }}{% if next %}?next={{ next|urlencode }}{% endif %}">Log In</a></p>
{% endblock %}
