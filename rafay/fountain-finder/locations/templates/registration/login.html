{% extends "locations/auth_base.html" %}
{% load static %}
{% block title %}Log In · Fountain Finder{% endblock %}
{% block content %}
<h1>Log In</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "locations/_form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="img-btn" type="submit" aria-label="Log In"><img src="{% static 'locations/img/login.png' %}" alt="" draggable="false"></button>
</form>
<p class="alt">New here? <a href="{{ signup_url }}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
{% endblock %}
