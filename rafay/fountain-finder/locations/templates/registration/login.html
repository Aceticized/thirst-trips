<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fountain Finder — Login</title></head>
<body>
  <main>
    <h1>Log in to Fountain Finder</h1>
    <p>Log in to see your points.</p>
    <p><a href="{% url 'signup' %}?next={{ next|urlencode }}">Create an account</a></p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
