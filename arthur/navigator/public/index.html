<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Navigator</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="ar" hidden>
    <div id="waypoint">
      <img class="pin" src="img/waypoint.png" alt="" draggable="false" />
      <div class="label">
        <strong id="wp-name"></strong>
        <span id="wp-distance"></span>
      </div>
    </div>
    <div id="edge-arrow"></div>

    <div id="hud">
      <div id="hud-info"></div>
      <div id="hud-calib">
        Compass
        <button id="calib-left" type="button">&minus;</button>
        <span id="calib-value">0&deg;</span>
        <button id="calib-right" type="button">+</button>
      </div>
    </div>
  </div>

  <button id="arrive-btn" type="button" aria-label="I arrived!" hidden>
    <img src="img/arrived.png" alt="" draggable="false" />
  </button>

  <div id="done-screen" hidden>
    <h1>You arrived!</h1>
    <p>Enjoy your drink.</p>
    <a id="done-home" href="#" hidden>Back to home</a>
  </div>

  <div id="map-panel" hidden>
    <div id="map"></div>
    <button id="recenter" type="button" hidden>Recenter</button>
  </div>

  <div id="calibration" hidden>
    <h2>Calibrate your compass</h2>
    <svg viewBox="0 0 200 100" class="fig8" aria-hidden="true">
      <path id="fig8-path" d="M100,50 C130,10 190,10 190,50 C190,90 130,90 100,50 C70,10 10,10 10,50 C10,90 70,90 100,50 Z" />
      <circle r="7" fill="#4ccf6e">
        <animateMotion dur="3s" repeatCount="indefinite">
          <mpath href="#fig8-path" />
        </animateMotion>
      </circle>
    </svg>
    <p class="big">Hold your phone upright and wave it in a figure&#8209;8 for a few seconds.</p>
    <div id="calib-bar"><div id="calib-fill"></div></div>
    <p id="calib-msg"></p>
    <p id="calib-gps"></p>
    <button id="calib-go" type="button" disabled>Start navigating</button>
  </div>

  <!-- Normally skipped: the navigator starts by itself. It only appears if the phone needs a tap
       (for example iPhone motion-sensor permission) or if something went wrong. -->
  <div id="start-screen" hidden>
    <h1>Navigator</h1>
    <p>Point your phone around to find the waypoint.</p>
    <button id="start-btn" type="button">Start AR</button>
    <p id="status" role="status"></p>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="vendor/maplibre-leaflet/leaflet-maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
