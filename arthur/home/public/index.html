<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fountain Finder</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <h1>Fountain Finder</h1>
    <span id="count"></span>
  </header>

  <div id="map"></div>

  <div id="bottom-fade"></div>
  <div id="bottom-bar">
    <a id="upload-btn" href="uploader/" aria-label="Upload fountain" title="Upload fountain" hidden>
      <img src="img/upload.png?v=1" alt="" draggable="false" />
    </a>
    <button id="drink-btn" type="button" aria-label="Drink! Find the nearest fountain" hidden>
      <img src="img/drink.png" alt="" draggable="false" />
    </button>
  </div>
  <p id="status" role="status" hidden></p>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="vendor/maplibre-leaflet/leaflet-maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
