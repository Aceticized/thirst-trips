<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff2dc" />
  <title>Upload Fountain</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a id="back-link" href="../" hidden>&larr; Back</a>

  <main>
    <h1>Upload Fountain</h1>
    <section id="camera" hidden>
      <video id="viewfinder" autoplay playsinline muted></video>
      <button id="shutter" type="button" aria-label="Take photo"></button>
    </section>

    <!-- Only shown when the live camera can't be opened. -->
    <button id="upload-btn" type="button" hidden>Take a photo</button>
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />

    <p id="status" role="status"></p>

    <section id="preview" hidden>
      <img id="preview-img" alt="Fountain preview" />
      <p id="preview-coords"></p>

      <form id="upload-form" novalidate>
        <label>
          Building
          <input id="building" type="text" maxlength="100" autocomplete="off" />
        </label>
        <p id="building-note" class="note"></p>

        <label>
          Floor
          <input id="floor" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="e.g. 2 or M2" />
        </label>

        <label class="check">
          <input id="accessible" type="checkbox" />
          Accessible
        </label>
        <p id="form-error" role="alert"></p>

        <button id="submit-btn" class="img-btn" type="submit" aria-label="Submit" disabled>
          <img src="img/submit.png" alt="" draggable="false" />
        </button>
        <button id="retake-btn" class="secondary" type="button">Retake photo</button>
      </form>
    </section>

    <section id="results"></section>
  </main>

  <script src="app.js"></script>
  <script src="/achievement-assets/popup.js?v=2" data-assets="/achievement-assets/" defer></script>
</body>
</html>
