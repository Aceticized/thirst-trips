<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fountain Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Fountain Finder</h1>

    <button id="upload-btn" type="button">Upload Fountain</button>
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />

    <p id="status" role="status"></p>

    <section id="preview" hidden>
      <img id="preview-img" alt="Fountain preview" />
      <p id="preview-coords"></p>

      <form id="upload-form" novalidate>
        <label>
          Building
          <input id="building" type="text" maxlength="100" autocomplete="off" />
        </label>
        <p id="building-note" class="note"></p>

        <label>
          Floor
          <input id="floor" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="e.g. 2 or M2" />
        </label>

        <label class="check">
          <input id="accessible" type="checkbox" />
          Accessible
        </label>
        <p id="form-error" role="alert"></p>

        <button id="submit-btn" type="submit" disabled>Submit</button>
      </form>
    </section>

    <section id="results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
